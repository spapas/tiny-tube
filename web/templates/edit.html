{{define "edit"}}<!doctype html>
<html lang="{{.Lang}}" data-theme="light"><head>{{template "head" .}}</head><body>
{{template "header" .}}
<main id="main" class="container upload-main">
  {{with .Video}}
  <a class="back-link" href="/watch?id={{.ID}}">{{template "back"}} {{t "nav.backToVideo"}}</a>
  <div class="page-heading"><span class="eyebrow muted">{{t "edit.eyebrow"}}</span><h1>{{t "edit.title"}}</h1><p>{{t "edit.description"}}</p></div>
  <form class="upload-card edit-card" method="POST" action="/api/edit" data-metadata-form>
    <div id="edit-error" class="notice notice-warning" role="alert"{{if not $.Error}} hidden{{end}}>{{$.Error}}</div>
    <input type="hidden" name="id" value="{{.ID}}">
    <div class="form-field"><label for="title">{{t "field.title"}} <span class="required-mark">*</span></label><input id="title" name="title" type="text" maxlength="512" value="{{.Title}}" required></div>
    <div class="form-field"><label for="desc">{{t "field.description"}} <span class="optional-label">{{t "field.optional"}}</span></label><textarea id="desc" name="desc" rows="6" maxlength="8192">{{.Desc}}</textarea></div>
    <div class="form-field"><label for="category">{{t "field.category"}} <span class="optional-label">{{t "field.optional"}}</span></label><input id="category" name="category" type="text" maxlength="256" value="{{.Category}}"></div>
    <div class="form-field"><label for="access_list">{{t "field.visibility"}}</label><select id="access_list" name="access_list"><option value="">{{t "visibility.public"}}</option>{{range $.AccessLists}}<option value="{{.ID}}"{{if eq $.Video.AccessList .ID}} selected{{end}}>{{t "visibility.locked" "Name" .Name}}</option>{{end}}</select><p class="field-hint">{{t "visibility.hint"}}</p></div>
    <div class="form-actions"><a class="text-link" href="/watch?id={{.ID}}">{{t "common.cancel"}}</a><button class="button button-primary" type="submit">{{t "edit.save"}}</button></div>
  </form>
  {{end}}
</main>
{{template "footer" .}}
</body></html>{{end}}
