name: Set up the module toolchain
description: Install and verify the exact patched Go toolchain declared in go.mod.
runs:
  using: composite
  steps:
    - name: Read the toolchain directive
      id: version
      shell: bash
      run: |
        version=''
        while read -r directive value; do
          if [[ "$directive" == 'toolchain' ]]; then
            value="${value%$'\r'}"
            version="${value#go}"
            break
          fi
        done < go.mod
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo 'go.mod must declare an exact patched toolchain version.' >&2
          exit 1
        fi
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ steps.version.outputs.version }}
        cache-dependency-path: go.sum
    - name: Verify the selected Go version
      shell: bash
      env:
        EXPECTED_GO: go${{ steps.version.outputs.version }}
      run: |
        actual="$(go env GOVERSION)"
        if [[ "$actual" != "$EXPECTED_GO" ]]; then
          echo "Wrong toolchain: expected $EXPECTED_GO, got $actual" >&2
          exit 1
        fi
        go version
