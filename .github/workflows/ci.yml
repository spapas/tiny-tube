name: Temporary Chromium verification
on:
  push:
    branches: [codex/v1.2.0-chromium-smoke]
permissions:
  contents: read
env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Build and check playback
        run: |
          go build -o "$RUNNER_TEMP/tiny-tube" .
          google-chrome --version
          node .github/scripts/temporary-chromium-check.cjs
