name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  quality:
    name: Go quality and UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check formatting of changed Go files
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORMAT_HEAD: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/check-gofmt.cjs
      - name: Verify dependencies and tidy state
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Go vet
        run: go vet ./...
      - name: UI behavior and JavaScript syntax
        run: |
          node --test tests/ui.test.cjs
          for file in web/static/*.js; do node --check "$file"; done

  test:
    name: Go tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, race
            os: ubuntu-24.04
            cgo: '1'
            flags: -race
          - name: Windows
            os: windows-2025
            cgo: '0'
            flags: ''
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require real FFmpeg integration coverage
        run: |
          command -v ffmpeg
          ffmpeg -version
      - name: Tests and coverage
        run: go test ${{ matrix.flags }} -count=1 -shuffle=on -timeout=10m -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out
      - name: Build without CGO
        env:
          CGO_ENABLED: '0'
        run: go build ./...
      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ runner.os }}
          path: coverage.out
          if-no-files-found: warn
          retention-days: 7

  security:
    name: Go vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan Linux code against the vulnerability database
        run: govulncheck ./...
      - name: Scan Windows code against the vulnerability database
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: govulncheck ./...
