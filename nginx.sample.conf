# Optional Go+Nginx example; capacity must be measured for the target deployment.
# Media stays behind Go's file identity, traversal and MIME checks.
# Set the hostname/certificate paths and run nginx -t before enabling it.
upstream tiny_go { server 127.0.0.1:8081; }

server {
  listen 443 ssl;
  server_name tube.hcg.gr;

  ssl_certificate /etc/pki/tls/certs/tube.hcg.gr.crt;
  ssl_certificate_key /etc/pki/tls/private/tube.hcg.gr.key;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Whole multipart request, matching Go's default MAX_UPLOAD_BYTES (2 GiB).
  client_max_body_size 2g;
  client_body_timeout 300s;

  # Extra protection; Go also blocks private files, links and staging paths.
  location ~* ^/videos/.*\.(?:db|sqlite|sqlite3)(?:-(?:wal|shm|journal))?$ { return 404; }
  location ~ ^/videos/(?:[^/]+/)*\. { return 404; }

  # Proxy media too: a direct alias would bypass DB hard-link protection.
  # Range/206 and HLS/poster content types are preserved by Go.
  location / {
    proxy_pass http://tiny_go;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Go authenticates upload/edit/delete routes using UPLOAD_USER/UPLOAD_PASS.
}
