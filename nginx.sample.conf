# Optional Go+Nginx example; capacity must be measured for the target deployment.
# Same VIDEO_DIR on disk, e.g. /srv/tiny-tube/videos
# Set the hostname/certificate paths and run nginx -t before enabling it.
upstream tiny_go { server 127.0.0.1:8080; }

server {
  listen 443 ssl;
  server_name tube.hcg.gr;

  ssl_certificate /etc/pki/tls/certs/tube.hcg.gr.crt;
  ssl_certificate_key /etc/pki/tls/private/tube.hcg.gr.key;

  # Whole multipart request, matching Go's default MAX_UPLOAD_BYTES (2 GiB).
  client_max_body_size 2g;
  client_body_timeout 300s;

  # HLS/originals served directly by Nginx (Range/206 native)
  location /videos/ {
    alias /srv/tiny-tube/videos/;
    sendfile on;
    tcp_nopush on;
    autoindex off;
    expires 1d;
    add_header Accept-Ranges bytes;
    types {
      application/vnd.apple.mpegurl m3u8;
      video/mp2t ts;
      video/mp4 mp4;
      video/quicktime mov;
      video/webm webm;
      video/x-matroska mkv;
    }
    # optional cache for edge nodes:
    # proxy_cache / edge with proxy_cache_path in http {}
  }

  location / {
    proxy_pass http://tiny_go;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Go authenticates both /upload and /api/upload using UPLOAD_USER/UPLOAD_PASS.
}
