# Optional Go+Nginx example; capacity must be measured for the target deployment.
# Media stays behind Go's file identity, traversal and MIME checks.
# Include in the http context. Set the hostname/certificates and run nginx -t.
upstream tiny_go { server 127.0.0.1:8081; }

# The request line and Referer can contain a locked-list key. Log paths only.
log_format tiny_tube '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time';

server {
  listen 443 ssl;
  server_name tube.example.org;

  ssl_certificate /etc/pki/tls/certs/tube.example.org.crt;
  ssl_certificate_key /etc/pki/tls/private/tube.example.org.key;
  add_header Strict-Transport-Security "max-age=31536000" always;
  access_log /var/log/nginx/tiny-tube.access.log tiny_tube;

  # Whole multipart request, matching Go's default MAX_UPLOAD_BYTES (2 GiB).
  client_max_body_size 2g;
  client_body_timeout 300s;

  # Extra protection; Go also blocks private files, links and staging paths.
  location ~* ^/videos/.*\.(?:db|sqlite|sqlite3)(?:-(?:wal|shm|journal))?$ { return 404; }
  location ~ ^/videos/(?:[^/]+/)*\. { return 404; }

  # Proxy media too: a direct alias would bypass DB hard-link protection.
  # Range/206 and HLS, poster and WebVTT content types are preserved by Go.
  location / {
    proxy_pass http://tiny_go;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Go authenticates management routes and authorizes locked media, including
  # subtitles. Terminate TLS here and set COOKIE_SECURE=true in Go.
}
