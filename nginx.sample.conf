# Go+Nginx mode (optional, for 1000 users). Go-only works without this.
# Same VIDEO_DIR on disk, e.g. /srv/tiny-tube/videos
upstream tiny_go { server 127.0.0.1:8080; }

server {
  listen 443 ssl;
  server_name tube.hcg.gr;

  # ssl_certificate /etc/pki/tls/certs/tube.hcg.gr.crt;
  # ssl_certificate_key /etc/pki/tls/private/tube.hcg.gr.key;

  # HLS/mp4 served directly by Nginx (cache-friendly, Range/206 native)
  location /videos/ {
    alias /srv/tiny-tube/videos/;
    sendfile on;
    tcp_nopush on;
    aio on;
    directio 512;
    max_ranges 255;
    expires 1d;
    add_header Accept-Ranges bytes;
    types {
      application/vnd.apple.mpegurl m3u8;
      video/mp2t ts;
      video/mp4 mp4;
    }
    # optional cache for edge nodes:
    # proxy_cache / edge with proxy_cache_path in http {}
  }

  location / {
    proxy_pass http://tiny_go;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # upload password (same as UPLOAD_USER/UPLOAD_PASS in Go):
  # location /api/upload { auth_basic "upload"; auth_basic_user_file /etc/nginx/.htpasswd; proxy_pass http://tiny_go; }
}
